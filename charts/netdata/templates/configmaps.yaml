apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "netdata.fullname" . }}-conf-child
  labels:
    app: netdata
    chart: netdata-3.7.176
    heritage: Helm
    release: netdata
  {{- include "netdata.labels" . | nindent 4 }}
data:
  go.d: {{ .Values.confChild.goD | toYaml | indent 1 }}
  kubelet: {{ .Values.confChild.kubelet | toYaml | indent 1 }}
  kubeproxy: {{ .Values.confChild.kubeproxy | toYaml | indent 1 }}
  netdata: {{ .Values.confChild.netdata | toYaml | indent 1 }}
  stream: {{ .Values.confChild.stream | toYaml | indent 1 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "netdata.fullname" . }}-child-sd-config-map
  labels:
    app: netdata
    chart: netdata-3.7.176
    heritage: Helm
    release: netdata
  {{- include "netdata.labels" . | nindent 4 }}
data:
  config.yml: {{ .Values.childSdConfigMap.configYml | toYaml | indent 1 }}
