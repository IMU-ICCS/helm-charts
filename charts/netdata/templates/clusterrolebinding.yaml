apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "netdata.fullname" . }}-netdata
  labels:
    app: netdata
    chart: netdata-3.7.176
    heritage: Helm
    release: netdata
  {{- include "netdata.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: '{{ include "netdata.fullname" . }}-netdata'
subjects:
  - kind: ServiceAccount
    name: '{{ include "netdata.serviceAccountName" . }}'
    namespace: '{{ .Release.Namespace }}'
